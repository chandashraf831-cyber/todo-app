
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="formvalidation.css">
</head>
<body>

    <div class="container">
        <form id="registerForm">
            <i class="fa-solid fa-circle-user"></i>
            <h1>Create Account</h1>
            <p class="subtitle">Register to get started</p>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
                <small class="userkaname"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
                <small class="userkaemailerror"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password" required>
                <small class="userkapassworderror"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                <small class="userkacomerror"></small>
            </div>

            <button type="submit" class="button">Create Account</button>
            <P class="successfull"></P>
            <p class="footer-text">
                Already have an account? <a href="#">Sign in</a>
            </p>
        </form>
        <div id="registrationuse">
              <div class="registered-Users">
                <i class="fa-solid fa-users"></i>
                <h2>Registered Users</h2>
              </div>
                <p id="noUsers">No registered users found.</p>
               <!-- <div class="user">
  
                   <div class="userkanameoremail">
                     <h3>Chand</h3>
                     <p>chandashraf@gmail.com</p>
              </div>
              <button type="click" class="dltbtn"><i class="fa-solid fa-trash" ></i></button>
               </div> -->
    </div>
    </div>
    <script src="formvalidation.js"></script>
</body>
</html>
